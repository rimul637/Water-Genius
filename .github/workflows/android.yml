name: Android release build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      WATER_KEYSTORE_BASE64: ${{ secrets.WATER_KEYSTORE_BASE64 }}
      WATER_STORE_PASSWORD: ${{ secrets.WATER_STORE_PASSWORD }}
      WATER_KEY_ALIAS: ${{ secrets.WATER_KEY_ALIAS }}
      WATER_KEY_PASSWORD: ${{ secrets.WATER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and lint
        run: ./gradlew testReleaseUnitTest lintRelease
      - name: Build and check signed artifacts
        if: ${{ env.WATER_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export WATER_SIGNING_STORE="$RUNNER_TEMP/water-release.p12"
          trap 'rm -f "$WATER_SIGNING_STORE"' EXIT
          printf '%s' "$WATER_KEYSTORE_BASE64" | base64 --decode > "$WATER_SIGNING_STORE"
          ./gradlew assembleRelease bundleRelease
          tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed APK and AAB
        if: ${{ env.WATER_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: water-genius-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
